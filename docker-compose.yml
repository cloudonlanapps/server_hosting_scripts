services:
  db:
    image: postgres:16-alpine
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_DIR}/db:/var/lib/postgresql/data
    # No external port - only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      args:
        REPO_BRANCH: ${REPO_BRANCH:-}
        GIT_URL: ${GIT_URL}
      # A build secret, not a build arg: an arg is interpolated into the RUN
      # instruction, which BuildKit echoes on failure and `docker history`
      # keeps in the layer metadata. The secret is a tmpfs file visible only to
      # the one RUN that mounts it.
      secrets:
        - gh_token
    container_name: ${SERVER_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      # Database connection
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # App configuration
      PROJECT_NAME: ${PROJECT_NAME}
      # Python package installed in the image; defaults to PROJECT_NAME.
      PACKAGE_NAME: ${PACKAGE_NAME:-}
      SECRET_KEY: ${SECRET_KEY}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      UPLOAD_DIR: /data/uploads
      STATIC_DIR: /data/static
      # CORS configuration (comma-separated origins or "*" for all)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${SERVER_PORT:-127.0.0.1:8000:8000}"
    volumes:
      - ${DATA_DIR}/uploads:/data/uploads
      - ${DATA_DIR}/static:/data/static
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

secrets:
  gh_token:
    # Read from the environment deploy.sh already exports; never written to disk.
    environment: GITHUB_TOKEN
