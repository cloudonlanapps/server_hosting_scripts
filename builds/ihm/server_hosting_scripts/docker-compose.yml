services:
  db:
    image: postgres:16-alpine
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      # The postgres image reads the password from a file when given _FILE, so
      # it never appears in this container's environment.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ${DATA_DIR}/db:/var/lib/postgresql/data
    # No external port - only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      args:
        REPO_BRANCH: ${REPO_BRANCH:-}
        GIT_URL: ${GIT_URL}
      # A build secret, not a build arg: an arg is interpolated into the RUN
      # instruction, which BuildKit echoes on failure and `docker history`
      # keeps in the layer metadata. The secret is a tmpfs file visible only to
      # the one RUN that mounts it.
      secrets:
        - gh_token
    container_name: ${SERVER_CONTAINER_NAME}
    restart: unless-stopped
    # Secrets are tmpfs files under /run/secrets, not environment entries, so
    # they are absent from `docker inspect`, from /proc/<pid>/environ and from
    # the compose config dump — all readable by anyone in the `docker` group,
    # which on a single-tenant host is close to root.
    #
    # Names are lowercase because pydantic-settings matches a secret file to a
    # settings field by name, and fields are lowercase. database_url is mounted
    # whole rather than assembled from parts: the URL interpolates the password,
    # so it cannot stay a compose string once the password is a file, and the
    # application reads `database_url` from the secrets dir with no code change.
    secrets:
      - database_url
      - secret_key
      - bootstrap_password
      - postgres_password
    environment:
      # Database connection — non-secret parts only; the URL and the password
      # arrive as secrets above.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      # App configuration
      PROJECT_NAME: ${PROJECT_NAME}
      # Python package installed in the image; defaults to PROJECT_NAME.
      PACKAGE_NAME: ${PACKAGE_NAME:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      UPLOAD_DIR: /data/uploads
      STATIC_DIR: /data/static
      # CORS configuration (comma-separated origins or "*" for all)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${SERVER_PORT:-127.0.0.1:8000:8000}"
    volumes:
      - ${DATA_DIR}/uploads:/data/uploads
      - ${DATA_DIR}/static:/data/static
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

secrets:
  gh_token:
    # Read from the environment deploy.sh already exports; never written to disk.
    environment: GITHUB_TOKEN
  # Runtime secrets, same mechanism: compose reads each from the deploying
  # process's environment and materialises it as a tmpfs file in the container.
  # The value is never written to disk on the host and never enters the
  # container's environment.
  database_url:
    environment: DATABASE_URL
  secret_key:
    environment: SECRET_KEY
  bootstrap_password:
    environment: BOOTSTRAP_PASSWORD
  postgres_password:
    environment: POSTGRES_PASSWORD
